packages:
  - api
  - front

allowBuilds:
  '@apollo/protobufjs': false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.15.0

overrides:
  '@graphql-tools/utils@<=12.0.0': ^12.0.1
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
